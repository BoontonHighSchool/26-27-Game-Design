<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cappy Quest | BHS Game Arcade</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
        }

        .back-button {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 8px;
            background: #374151;
        }

        .back-button:hover {
            background: #4b5563;
        }

        .game-title {
            margin-left: 25px;
            font-size: 22px;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px;
        }

        .game-info {
            margin-bottom: 20px;
        }

        .game-info h1 {
            margin: 0 0 5px 0;
        }

        .game-info p {
            margin: 0;
            color: #9ca3af;
        }

        .game-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            margin-top: 15px;
            text-align: right;
        }

        .fullscreen-button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #374151;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .fullscreen-button:hover {
            background: #4b5563;
        }

    </style>

</head>

<body>

<header>

    <a href="../" class="back-button">
        ← Back to Arcade
    </a>

    <div class="game-title">
        Cappy Quest
    </div>

</header>

<main>

    <div class="game-info">

        <h1>Cappy Quest</h1>

        <p>
            Platformer • Mr. M Sample
        </p>

    </div>

    <div class="game-container" id="game-container">

        <iframe
            src="../Games/CappyQuest/"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

    <div class="controls">

        <button
            class="fullscreen-button"
            onclick="goFullscreen()">

            ⛶ Fullscreen

        </button>

    </div>

</main>

<script>

function goFullscreen() {

    const game = document.getElementById("game-container");

    if (game.requestFullscreen) {
        game.requestFullscreen();
    }

}

</script>

</body>

</html>
