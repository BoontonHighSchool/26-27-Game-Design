<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BHS Game Arcade</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
        }

        .site-title {
            font-size: 22px;
            font-weight: bold;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        .intro {
            margin-bottom: 35px;
        }

        .intro h1 {
            margin: 0 0 8px 0;
            font-size: 32px;
        }

        .intro p {
            margin: 0;
            color: #9ca3af;
            font-size: 17px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .game-card h3 {
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        .game-info {
            color: #9ca3af;
            margin: 0 0 20px 0;
        }

        .play-button {
            display: inline-block;
            color: white;
            background: #374151;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .play-button:hover {
            background: #4b5563;
        }

        footer {
            margin-top: 50px;
            padding: 20px 25px;
            text-align: center;
            color: #6b7280;
            border-top: 1px solid #374151;
        }

    </style>

</head>


<body>


<header>

    <div class="site-title">
        BHS Game Arcade
    </div>

</header>


<main>


    <div class="intro">

        <h1>BHS Game Arcade</h1>

        <p>
            Student-created games from Game Design Honors - 26-27
        </p>

    </div>


    <h2 class="section-title">
        Featured Games
    </h2>


    <div class="games">


        <div class="game-card">

            <h3>
                Cappy Quest
            </h3>

            <p class="game-info">
                Platformer • Mr. M Sample
            </p>

            <a
                href="Play/CappyQuest.html"
                class="play-button">

                PLAY GAME

            </a>

        </div>


    </div>


</main>


<footer>

    BHS Game Design Honors • 2026-2027

</footer>


</body>

</html>
